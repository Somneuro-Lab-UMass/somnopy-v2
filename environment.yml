name: somnopy
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip

  # Notebook environment
  - jupyter
  - notebook
  - ipykernel

  # Scientific stack used by notebooks/package
  - numpy>=1.23.5
  - pandas>=1.5.2
  - scipy>=1.9.3
  - matplotlib>=3.6.2
  - seaborn>=0.12.1
  - statsmodels>=0.13.5
  - pytz>=2022.6

  # EEG / PSG analysis
  - mne>=1.8.0

  # Useful for reading Excel files if your project uses .xlsx CBT files
  - openpyxl

  # Install package and pip-only dependencies
  - pip:
      - -e ./somnopy